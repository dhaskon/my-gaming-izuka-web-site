<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>මගේ පළමු වෙබ් අඩවිය</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #007bff;
        }
        .my-button {
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .my-button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <h1>සාදරයෙන් පිළිගන්නවා!</h1>
    <p>මේක මගේ පළමු වෙබ් අඩවිය.</p>
    
    <button class="my-button" onclick="showMessage()">මෙතන ක්ලික් කරන්න</button>

    <script>
        function showMessage() {
            alert('ඔබ බොත්තම ක්ලික් කළා!');
        }
    </script>

</body>
</html>
